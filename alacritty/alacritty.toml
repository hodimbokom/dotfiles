general.live_config_reload = true

[font]
size = 14

[font.offset]
x = 0
y = 6

[font.glyph_offset]
x = 0
y = 3

[font.normal]
family = "JetBrainsMono NFM"
style = "Regular"

[font.bold]
family = "JetBrainsMono NFM"
style = "Bold"

[font.italic]
family = "JetBrainsMono NFM"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono NFM"
style = "Bold Italic"

[mouse]
hide_when_typing = true

[window]
decorations = "None"
opacity = 0.95

[window.padding]
x = 10
y = 10

[scrolling]
history = 12000

[[keyboard.bindings]]
key = "I"
mods = "Control | Shift"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "U"
mods = "Control"
mode = "Vi"
action = "ScrollHalfPageUp"

[[keyboard.bindings]]
key = "D"
mods = "Control"
mode = "Vi"
action = "ScrollHalfPageDown"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
