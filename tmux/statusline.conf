set -g mode-style "fg=#232136,bg=#c4a7e7"
set -g message-style "fg=#232136,bg=#c4a7e7"
set -g message-command-style "fg=#232136,bg=#c4a7e7"

set -ug status-format
set -g status on
set -g status-interval 0
set -g status-justify left
set -g status-style "fg=#6e6a86,bg=#232136"
set -g status-bg "#232136"

set -g status-left-length 48
set -g status-right-length 500
set -g status-left-style NONE
set -g status-right-style NONE

set -g @cctask_kb EN
set -g status-left "#{?client_prefix,#[bg=#f6c177],#[bg=#b4b1c8]}#[fg=#232136,bold] #{@cctask_gh}#S #[default]"
set -g status-right "#{@cctask_git}#{@cctask_sys}#{@cctask_clock}#[fg=#232136,bg=#c4a7e7,bold] #{@cctask_kb} "
if-shell "uname -s | grep -q Darwin" 'run-shell -b "~/.config/bin/tmux-status-watch #{pid}"'
set-hook -g after-select-pane 'run-shell -b "~/.config/bin/tmux-status pane"'
set-hook -g after-select-window 'run-shell -b "~/.config/bin/tmux-status pane"'
set-hook -g client-session-changed 'run-shell -b "~/.config/bin/tmux-status pane"'

setw -g window-status-activity-style "underscore,fg=#908caa,bg=#232136"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#6e6a86,bg=#232136"
setw -g window-status-format "#[fg=#6e6a86,bg=#232136] #I #[fg=#908caa,bg=#232136]#W#{@cctask_claude} "
setw -g window-status-current-format "#[fg=#b4b1c8,bg=#393552] #I #W#{@cctask_claude} #[default]"
