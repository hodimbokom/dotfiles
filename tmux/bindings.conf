set-window-option -g mode-keys vi

unbind-key C-b
unbind-key C-e
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"
bind o run-shell "open #{pane_current_path}"
bind -r e kill-pane -a

bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R

bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5


unbind-key t
unbind-key v
unbind-key C-v
unbind-key a
bind-key s choose-tree -Zs \
  -f '#{?#{==:#{session_name},_cctask_hidden},0,1}' \
  -F '#{?pane_format,#{pane_current_command},#{?window_format,#{window_index}: #{window_name},#{session_windows} windows#{?session_attached, (attached),}}}'
bind-key t run-shell "~/.config/bin/tmux-pane '#{window_id}' shell"
bind-key a run-shell "~/.config/bin/tmux-pane '#{window_id}' editor"
bind-key C run-shell "~/.config/bin/tmux-pane '#{window_id}' claude"
bind-key c new-window

bind B run-shell "tmux display-popup -E -h 90% -w 90% -T 'btop' 'btop' 2>/dev/null || tmux new-window -n btop 'btop'"
bind g run-shell "tmux display-popup -d '#{pane_current_path}' -E -h 90% -w 90% -T 'lazygit' 'lazygit' 2>/dev/null || tmux new-window -n lazygit 'lazygit'"

