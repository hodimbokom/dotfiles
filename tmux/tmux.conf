set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc"
set -g repeat-time 3
set -g focus-events on
set -g mouse on

setw -g pane-border-status off
set -g history-limit 64096
set -sg escape-time 10

set-option -g pane-border-style fg=#ea9a97
set-option -g pane-active-border-style fg=#ea9a97

if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/bindings.conf
source ~/.config/tmux/statusline.conf

set -g default-command "reattach-to-user-namespace -l $SHELL"

# Plugin options must be set before the plugins load: continuum reads
# @continuum-boot and @continuum-restore the moment continuum.tmux runs.
set -g @continuum-restore 'on'
# 'on' installs a LaunchAgent that opens Alacritty fullscreen at every login.
# Set it back to 'on' (with the options line) if you want that.
set -g @continuum-boot 'off'
# set -g @continuum-boot-options 'alacritty,fullscreen'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes '~Vim -> vim'

# Plugins live in tmux/plugins, which this repo ignores. Install them with:
#   git clone https://github.com/tmux-plugins/tmux-resurrect ~/.config/tmux/plugins/tmux-resurrect
#   git clone https://github.com/tmux-plugins/tmux-continuum ~/.config/tmux/plugins/tmux-continuum
if-shell "[ -f ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux ]" \
  "run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "[ -f ~/.config/tmux/plugins/tmux-continuum/continuum.tmux ]" \
  "run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux"


