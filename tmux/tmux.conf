set -g default-terminal "tmux-256color"
set -g terminal-overrides "xterm*:Tc,*:Setulc@,*:Smulx@,*:setulc@,*:smulx@"
set -as terminal-features "xterm*:RGB"
set -g repeat-time 3
set -g focus-events on
set -g mouse on
set -g cursor-style block
set -g renumber-windows on

setw -g pane-border-status off
set -g history-limit 64096
set -sg escape-time 10

set-option -g pane-border-lines single
set-option -g pane-border-style fg=#6e6a86,bg=default
set-option -g pane-active-border-style fg=#7f7b98,bg=default
set-option -ug window-style
set-option -ug window-active-style

if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/bindings.conf
source ~/.config/tmux/statusline.conf

set -g default-command "reattach-to-user-namespace -l $SHELL"

set -g @continuum-restore 'on'
set -g @continuum-boot 'off'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~claude->claude --continue *"'
set -g @resurrect-hook-post-save-layout '~/.config/bin/tmux-resurrect-fix save'
set -g @resurrect-hook-post-restore-all '~/.config/bin/tmux-resurrect-fix restore'

if-shell "[ -f ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux ]" \
  "run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "[ -f ~/.config/tmux/plugins/tmux-continuum/continuum.tmux ]" \
  "run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux"
